name: Newsroom — soạn nháp tin hằng ngày

# 06:00 giờ Nhật = 21:00 UTC hôm trước.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Số tin tối đa soạn trong lần chạy này'
        required: false
        default: '5'

# Workflow tự mở PR nên cần quyền ghi; không cần gì hơn.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: newsroom-daily
  cancel-in-progress: false

jobs:
  draft:
    name: Thu thập, xếp hạng và soạn nháp
    runs-on: ubuntu-latest

    steps:
      # Không có secret thì bỏ qua êm, đừng fail. Cron chạy mỗi ngày, nên một
      # job đỏ vì thiếu cấu hình sẽ gửi mail báo lỗi hằng ngày cho đến khi ai
      # đó chịu tắt nó đi — và lúc đó người ta cũng tắt luôn cảnh báo thật.
      - name: Kiểm tra OPENAI_API_KEY
        id: guard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Newsroom bỏ qua::Chưa cấu hình secret OPENAI_API_KEY. Thêm ở Settings → Secrets and variables → Actions rồi workflow sẽ tự chạy."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.has_key == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.guard.outputs.has_key == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        if: steps.guard.outputs.has_key == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài dependencies
        if: steps.guard.outputs.has_key == 'true'
        run: |
          npm ci
          pip install pillow fonttools brotli

      # Font tiếng Nhật cho ảnh card. Font thương hiệu đến từ npm, nhưng
      # kanji thì không — thiếu nó render_card.py sẽ dừng chứ không vẽ tofu.
      - name: Cài font tiếng Nhật
        if: steps.guard.outputs.has_key == 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-ipafont-gothic

      - name: Soạn nháp
        if: steps.guard.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Tên model và endpoint là variables, không phải secrets — chúng không
          # bí mật, và để ở variables thì đọc được ngay trong log khi cần soi.
          NEWSROOM_MODEL: ${{ vars.NEWSROOM_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          NEWSROOM_LIMIT: ${{ github.event.inputs.limit || '5' }}
        run: node scripts/newsroom/run.mjs

      - name: Mở PR nếu có nháp mới
        if: steps.guard.outputs.has_key == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: newsroom/drafts-${{ github.run_number }}
          title: 'Nháp tin ngày ${{ github.run_number }}'
          body: |
            Nháp tự động từ workflow Newsroom.

            **Chưa bài nào được xuất bản.** Mọi bản ghi mang `status: "review"`
            và ô `reviewer` còn trống. Đọc `newsroom/drafts/<ngày>/README.md`
            trước — nó liệt kê những điểm model tự đánh dấu là chưa chắc.

            Quy trình duyệt:
            1. Mở link nguồn, đối chiếu từng số liệu và mốc thời gian.
            2. Sửa bản ghi nếu cần, điền tên mình vào `review.reviewer`.
            3. Chuyển bản ghi vào tầng nội dung rồi mới đổi `status`.
            4. Copy `<slug>.caption.txt` sang fanpage, đính kèm `<slug>.png`.
          commit-message: 'newsroom: nháp tin tự động'
          add-paths: newsroom/drafts
          draft: true
