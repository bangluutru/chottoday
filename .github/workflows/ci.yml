name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate content schema & trust governance
        run: npm run validate:content

      - name: Validate tool recommendations & references
        run: npm run validate:tool-refs

      - name: Validate discovery engine & zero-hallucination tests
        run: npm run test:discovery

      - name: Validate net-salary calculator formula
        run: npm run test:net-salary

      - name: Build production bundle & prerender SEO metadata
        run: npm run build
